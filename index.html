  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* =========================================================
       1. 앱 상태 관리
       ========================================================= */
    const STORAGE_KEY = 'sharecal_events_data';
    let events = [];
    let currentDate = new Date(); // 현재 뷰의 기준 날짜
    let currentView = 'month'; // 'month' | 'week' | 'day'
    let isReadOnlyMode = false;
    let activeViewingEventId = null;
    let selectedColor = 'color-butter';

    // UTF-8 안전 Base64 인코더/디코더
    function encodeStateToBase64(data) {
      try {
        const json = JSON.stringify(data);
        const bytes = new TextEncoder().encode(json);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      } catch (err) {
        console.error('인코딩 오류:', err);
        return null;
      }
    }

    function decodeStateFromBase64(base64Str) {
      try {
        const binary = atob(base64Str);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      } catch (err) {
        console.error('디코딩 오류:', err);
        return null;
      }
    }

    /* =========================================================
       2. 초기화 및 로드 (읽기 전용 / 공유 링크 파싱)
       ========================================================= */
    function loadInitialEvents() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      
      const mode = params.get('mode');
      isReadOnlyMode = (mode === 'readonly');

      if (isReadOnlyMode) {
        document.body.classList.add('is-readonly');
        document.getElementById('readonlyBanner').classList.add('active');
      } else {
        document.body.classList.remove('is-readonly');
        document.getElementById('readonlyBanner').classList.remove('active');
      }

      let sharedData = params.get('data');

      if (sharedData) {
        sharedData = sharedData.replace(/ /g, '+');
        const restored = decodeStateFromBase64(sharedData);
        if (Array.isArray(restored)) {
          events = restored;
          if (isReadOnlyMode) {
            showToast('🔒 읽기 전용 공유 일정 모드로 열람 중입니다.');
          } else {
            saveEventsToStorage(false); // 수정 가능 모드 공유 시 로컬에 저장
            showToast('🔗 공유받은 일정을 성공적으로 불러왔습니다!');
          }

          if (events.length > 0 && events[0].date) {
            const firstDate = new Date(events[0].date);
            if (!isNaN(firstDate)) {
              currentDate = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate());
            }
          }
          return;
        }
      }

      // 일반 접속 시 로컬 스토리지에서 로드
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          events = JSON.parse(saved);
        } else {
          // 따뜻한 버터 감성 기본 샘플 데이터 (휴가 및 시간 범위 샘플 포함)
          const todayStr = formatDate(new Date());
          events = [
            {
              id: 'sample-vacation-1',
              category: 'vacation',
              vacationer: '김휴가',
              vacationType: '연차',
              startDate: todayStr,
              endDate: todayStr,
              title: '🏖️ [연차] 김휴가',
              date: todayStr,
              color: 'color-rose',
              memo: '업무 인수인계: 이협업 매니저 (긴급 시 연락 가능)'
            },
            {
              id: 'sample-1',
              category: 'normal',
              title: '🧈 버터 스콘 & 커피 타임',
              date: todayStr,
              time: '10:00',
              endTime: '11:30',
              color: 'color-butter',
              memo: '달콤한 디저트와 함께 주간 일정 정리하기'
            },
            {
              id: 'sample-2',
              category: 'normal',
              title: '📝 주간 기획 & 디자인 리뷰',
              date: todayStr,
              time: '14:00',
              endTime: '15:30',
              color: 'color-peach',
              memo: '상단의 [읽기 전용 링크]로 동료들에게 캘린더를 공유해보세요!'
            }
          ];
          saveEventsToStorage(false);
        }
      } catch (e) {
        events = [];
      }
    }

    function saveEventsToStorage(notify = false) {
      if (isReadOnlyMode) return; // 읽기 전용 상태일 때는 로컬스토리지 변경하지 않음
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        if (notify) {
          showToast('일정이 저장되었습니다.');
        }
      } catch (e) {
        console.error('로컬스토리지 저장 실패:', e);
      }
    }

    /* =========================================================
       3. 날짜 및 유틸리티 함수
       ========================================================= */
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getDayOfWeekKorean(dayIndex) {
      return ['일', '월', '화', '수', '목', '금', '토'][dayIndex];
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3500);
    }

    // 주간 날짜 범위 계산 (일요일 시작)
    function getWeekRange(date) {
      const day = date.getDay(); // 0(일) ~ 6(토)
      const sunday = new Date(date);
      sunday.setDate(date.getDate() - day);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        days.push(d);
      }
      return days;
    }

    /* =========================================================
       휴가 / 연차 유틸리티 및 아이콘
       ========================================================= */
    function getVacationIcon(type) {
      switch (type) {
        case '연차': return '🏖️';
        case '오전반차': return '⛅';
        case '오후반차': return '☕';
        case '병가': return '🏥';
        case '출장': return '💼';
        default: return '🌴';
      }
    }

    // 특정 날짜에 해당하는 일정/휴가 여부 판별 (시작일~종료일 기간 지원)
    function isEventOnDate(evt, dateStr) {
      if (evt.category === 'vacation') {
        const start = evt.startDate || evt.date;
        const end = evt.endDate || evt.date || evt.startDate;
        return dateStr >= start && dateStr <= end;
      }
      return evt.date === dateStr;
    }

    // 일정 시간 포맷팅 ("시작시간 ~ 종료시간" 또는 "시작시간")
    function formatEventTime(evt) {
      if (evt.category === 'vacation') {
        return evt.vacationType || '휴가';
      }
      const start = evt.time || '';
      const end = evt.endTime || '';
      if (start && end) {
        return `${start} ~ ${end}`;
      }
      if (start) {
        return start;
      }
      if (end) {
        return `~ ${end}`;
      }
      return '';
    }

    // 같은 날짜 안에서 시간 순서대로 정렬 (휴가 우선 -> 시간순 오름차순)
    function sortEvents(list) {
      return list.slice().sort((a, b) => {
        const aIsVac = (a.category === 'vacation') ? 0 : 1;
        const bIsVac = (b.category === 'vacation') ? 0 : 1;
        if (aIsVac !== bIsVac) return aIsVac - bIsVac;

        const aTime = a.time || '00:00';
        const bTime = b.time || '00:00';
        if (aTime !== bTime) {
          return aTime.localeCompare(bTime);
        }
        const aEnd = a.endTime || '00:00';
        const bEnd = b.endTime || '00:00';
        return aEnd.localeCompare(bEnd);
      });
    }

    /* =========================================================
       대한민국 법정 공휴일 데이터 및 판별기
       ========================================================= */
    const SOLAR_HOLIDAYS = {
      '01-01': '신정',
      '03-01': '삼일절',
      '05-05': '어린이날',
      '06-06': '현충일',
      '08-15': '광복절',
      '10-03': '개천절',
      '10-09': '한글날',
      '12-25': '크리스마스'
    };

    const DYNAMIC_HOLIDAYS = {
      // 2025년
      '2025-01-28': '설날 연휴',
      '2025-01-29': '설날',
      '2025-01-30': '설날 연휴',
      '2025-03-03': '대체공휴일',
      '2025-05-06': '대체공휴일',
      '2025-10-05': '추석 연휴',
      '2025-10-06': '추석',
      '2025-10-07': '추석 연휴',
      '2025-10-08': '대체공휴일',
      // 2026년
      '2026-02-16': '설날 연휴',
      '2026-02-17': '설날',
      '2026-02-18': '설날 연휴',
      '2026-03-02': '대체공휴일',
      '2026-05-24': '부처님오신날',
      '2026-05-25': '대체공휴일',
      '2026-09-24': '추석 연휴',
      '2026-09-25': '추석',
      '2026-09-26': '추석 연휴',
      '2026-10-05': '대체공휴일',
      // 2027년
      '2027-02-06': '설날 연휴',
      '2027-02-07': '설날',
      '2027-02-08': '설날 연휴',
      '2027-02-09': '대체공휴일',
      '2027-05-13': '부처님오신날',
      '2027-09-14': '추석 연휴',
      '2027-09-15': '추석',
      '2027-09-16': '추석 연휴'
    };

    function getPublicHoliday(dateStr) {
      if (DYNAMIC_HOLIDAYS[dateStr]) {
        return DYNAMIC_HOLIDAYS[dateStr];
      }
      const mmdd = dateStr.slice(5);
      return SOLAR_HOLIDAYS[mmdd] || null;
    }

    /* =========================================================
       4. 뷰 렌더러 (월간 / 주간 / 일간 통합 제어)
       ========================================================= */
    function renderMainView() {
      const card = document.getElementById('calendarCard');
      const dateDisplay = document.getElementById('currentDateDisplay');

      // 상단 탭 활성화 상태 동기화
      document.querySelectorAll('.view-tab-btn').forEach(btn => {
        if (btn.getAttribute('data-view') === currentView) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (currentView === 'month') {
        renderMonthView(card, dateDisplay);
      } else if (currentView === 'week') {
        renderWeekView(card, dateDisplay);
      } else if (currentView === 'day') {
        renderDayView(card, dateDisplay);
      }

      // 우측 사이드바 동기화 렌더링
      renderSidebar();
    }

    // --- 1) 월간 뷰 ---
    function renderMonthView(container, dateDisplay) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      dateDisplay.textContent = `${year}년 ${month + 1}월`;

      container.innerHTML = `
        <div class="weekday-header">
          <div class="weekday sun">일</div>
          <div class="weekday">월</div>
          <div class="weekday">화</div>
          <div class="weekday">수</div>
          <div class="weekday">목</div>
          <div class="weekday">금</div>
          <div class="weekday sat">토</div>
        </div>
        <div class="calendar-grid" id="monthGrid"></div>
      `;

      const grid = document.getElementById('monthGrid');
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startDayOfWeek = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      const prevMonthLastDate = new Date(year, month, 0).getDate();

      const todayStr = formatDate(new Date());
      const totalCells = (startDayOfWeek + daysInMonth > 35) ? 42 : 35;

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        let dateObj;
        let isCurrentMonth = true;

        if (i < startDayOfWeek) {
          const dayNum = prevMonthLastDate - startDayOfWeek + i + 1;
          dateObj = new Date(year, month - 1, dayNum);
          isCurrentMonth = false;
          cell.classList.add('other-month');
        } else if (i >= startDayOfWeek + daysInMonth) {
          const dayNum = i - (startDayOfWeek + daysInMonth) + 1;
          dateObj = new Date(year, month + 1, dayNum);
          isCurrentMonth = false;
          cell.classList.add('other-month');
        } else {
          const dayNum = i - startDayOfWeek + 1;
          dateObj = new Date(year, month, dayNum);
        }

        const dateStr = formatDate(dateObj);
        const dayOfWeek = dateObj.getDay();
        const holiday = getPublicHoliday(dateStr);

        if (dayOfWeek === 0) cell.classList.add('is-sun');
        if (dayOfWeek === 6) cell.classList.add('is-sat');
        if (holiday) cell.classList.add('is-holiday');
        if (dateStr === todayStr) cell.classList.add('today');

        // 셀 헤더 (날짜 숫자, 공휴일 태그, 추가 버튼)
        const header = document.createElement('div');
        header.className = 'day-header';

        const numWrapper = document.createElement('div');
        numWrapper.className = 'day-num-wrapper';

        const numSpan = document.createElement('span');
        numSpan.className = 'day-number';
        numSpan.textContent = dateObj.getDate();
        numWrapper.appendChild(numSpan);

        if (holiday) {
          const holidayBadge = document.createElement('span');
          holidayBadge.className = 'holiday-badge';
          holidayBadge.textContent = holiday;
          holidayBadge.title = holiday;
          numWrapper.appendChild(holidayBadge);
        }

        header.appendChild(numWrapper);

        if (!isReadOnlyMode) {
          const addBtn = document.createElement('button');
          addBtn.className = 'cell-add-btn';
          addBtn.title = '이 날짜에 새 일정/휴가 추가';
          addBtn.innerHTML = '+';
          addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openAddModal(dateStr);
          });
          header.appendChild(addBtn);
        }

        cell.appendChild(header);

        // 일정 목록 (휴가 일정을 상단에 우선 배치하고, 시간순 오름차순 정렬)
        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'events-container';

        const dayEvents = sortEvents(events.filter(evt => isEventOnDate(evt, dateStr)));

        dayEvents.forEach(evt => {
          const isVac = evt.category === 'vacation';
          const pill = document.createElement('div');
          pill.className = `event-pill ${isVac ? 'is-vacation' : (evt.color || 'color-butter')}`;
          pill.setAttribute('data-id', evt.id);

          const timeStr = formatEventTime(evt);
          if (timeStr) {
            const timeSpan = document.createElement('span');
            timeSpan.className = 'event-time';
            timeSpan.textContent = timeStr;
            pill.appendChild(timeSpan);
          }

          const titleSpan = document.createElement('span');
          titleSpan.className = 'event-title';
          titleSpan.textContent = evt.title || '제목 없음';
          pill.appendChild(titleSpan);

          pill.addEventListener('click', (e) => {
            e.stopPropagation();
            openEditModal(evt.id);
          });

          eventsContainer.appendChild(pill);
        });

        cell.appendChild(eventsContainer);

        // 빈 영역 클릭 시 동작
        cell.addEventListener('click', () => {
          if (isReadOnlyMode) {
            showToast('🔒 읽기 전용 모드에서는 일정을 추가할 수 없습니다.');
          } else {
            openAddModal(dateStr);
          }
        });

        grid.appendChild(cell);
      }
    }

    // --- 2) 주간 뷰 ---
    function renderWeekView(container, dateDisplay) {
      const weekDays = getWeekRange(currentDate);
      const first = weekDays[0];
      const last = weekDays[6];

      dateDisplay.textContent = `${first.getFullYear()}. ${first.getMonth() + 1}. ${first.getDate()} ~ ${last.getMonth() + 1}. ${last.getDate()}`;

      const wrapper = document.createElement('div');
      wrapper.className = 'week-view-container';

      const todayStr = formatDate(new Date());

      weekDays.forEach(dayObj => {
        const dateStr = formatDate(dayObj);
        const dayOfWeek = dayObj.getDay();
        const isToday = (dateStr === todayStr);
        const holiday = getPublicHoliday(dateStr);

        const column = document.createElement('div');
        column.className = `week-column ${isToday ? 'today' : ''} ${holiday ? 'is-holiday' : ''}`;

        // 주간 요일 헤더
        const header = document.createElement('div');
        header.className = 'week-column-header';

        const nameSpan = document.createElement('span');
        nameSpan.className = `week-day-name ${dayOfWeek === 0 || holiday ? 'sun' : dayOfWeek === 6 ? 'sat' : ''}`;
        nameSpan.textContent = getDayOfWeekKorean(dayOfWeek);

        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'week-day-badge';
        badgeSpan.textContent = dayObj.getDate();

        header.appendChild(nameSpan);
        header.appendChild(badgeSpan);

        if (holiday) {
          const holidayBadge = document.createElement('span');
          holidayBadge.className = 'week-holiday-badge';
          holidayBadge.textContent = holiday;
          header.appendChild(holidayBadge);
        }

        column.appendChild(header);

        // 본문 일정 카드 목록 (시간순 오름차순 정렬)
        const body = document.createElement('div');
        body.className = 'week-column-body';

        const dayEvents = sortEvents(events.filter(e => isEventOnDate(e, dateStr)));

        dayEvents.forEach(evt => {
          const isVac = evt.category === 'vacation';
          const card = document.createElement('div');
          card.className = `week-event-card ${isVac ? 'is-vacation' : (evt.color || 'color-butter')}`;

          const cardTop = document.createElement('div');
          cardTop.className = 'card-top';

          const titleSpan = document.createElement('span');
          titleSpan.className = 'card-title';
          titleSpan.textContent = evt.title;
          cardTop.appendChild(titleSpan);

          const timeStr = formatEventTime(evt);
          if (timeStr) {
            const timeSpan = document.createElement('span');
            timeSpan.className = 'card-time';
            timeSpan.textContent = timeStr;
            cardTop.appendChild(timeSpan);
          }

          card.appendChild(cardTop);

          if (evt.memo && evt.memo.trim()) {
            const memoSpan = document.createElement('span');
            memoSpan.className = 'card-memo';
            memoSpan.textContent = evt.memo;
            card.appendChild(memoSpan);
          }

          card.addEventListener('click', (e) => {
            e.stopPropagation();
            openEditModal(evt.id);
          });

          body.appendChild(card);
        });

        // 일정 추가 유도 버튼 (읽기 전용 제외)
        if (!isReadOnlyMode) {
          const addPrompt = document.createElement('div');
          addPrompt.className = 'week-add-prompt';
          addPrompt.innerHTML = '+ 일정/휴가 추가';
          addPrompt.addEventListener('click', () => openAddModal(dateStr));
          body.appendChild(addPrompt);
        }

        column.appendChild(body);
        wrapper.appendChild(column);
      });

      container.innerHTML = '';
      container.appendChild(wrapper);
    }

    // --- 3) 일간 뷰 ---
    function renderDayView(container, dateDisplay) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const day = currentDate.getDate();
      const dayOfWeekName = getDayOfWeekKorean(currentDate.getDay());
      const dateStr = formatDate(currentDate);
      const holiday = getPublicHoliday(dateStr);

      dateDisplay.textContent = `${year}년 ${month}월 ${day}일 (${dayOfWeekName})`;

      const dayEvents = sortEvents(events.filter(e => isEventOnDate(e, dateStr)));

      let eventsHtml = '';
      if (dayEvents.length === 0) {
        eventsHtml = `
          <div class="day-empty-state">
            <div class="empty-icon">☕</div>
            <p>오늘 예정된 일정이 없습니다. 여유로운 하루를 즐겨보세요!</p>
            ${!isReadOnlyMode ? `<button class="btn btn-primary" onclick="openAddModal('${dateStr}')">+ 새 일정/휴가 등록하기</button>` : ''}
          </div>
        `;
      } else {
        eventsHtml = dayEvents.map(evt => {
          const isVac = evt.category === 'vacation';
          const timeDisplay = formatEventTime(evt) || '종일';
          return `
            <div class="day-timeline-card ${isVac ? 'is-vacation' : (evt.color || 'color-butter')}" onclick="openEditModal('${evt.id}')">
              <div class="day-card-time">${timeDisplay}</div>
              <div class="day-card-content">
                <div class="day-card-title">${escapeHtml(evt.title)}</div>
                ${evt.memo ? `<div class="day-card-memo">${escapeHtml(evt.memo)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      const holidayBadgeHtml = holiday ? `<span class="day-holiday-badge">🎌 ${holiday}</span>` : '';

      container.innerHTML = `
        <div class="day-view-container">
          <div class="day-banner-card">
            <div>
              <div class="day-banner-title">
                <span>🗓️ ${month}월 ${day}일 (${dayOfWeekName})</span>
                ${holidayBadgeHtml}
              </div>
              <div class="day-banner-desc">총 ${dayEvents.length}개의 일정 및 휴가가 등록되어 있습니다.</div>
            </div>
            ${!isReadOnlyMode ? `
              <button class="btn btn-primary" onclick="openAddModal('${dateStr}')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                일정/휴가 추가
              </button>
            ` : ''}
          </div>
          <div class="day-timeline-list">
            ${eventsHtml}
          </div>
        </div>
      `;
    }

    /* =========================================================
       우측 사이드바 렌더러 (휴가 현황 & 오늘의 일정 & 이번 주 일정)
       ========================================================= */
    function renderSidebar() {
      renderVacationBriefing();
      renderTodayBriefing();
      renderWeekBriefing();
    }

    // 1) 휴가 현황 위젯 (오늘 & 이번 주)
    function renderVacationBriefing() {
      const today = new Date();
      const todayStr = formatDate(today);

      const weekDays = getWeekRange(currentDate);
      const weekStartStr = formatDate(weekDays[0]);
      const weekEndStr = formatDate(weekDays[6]);

      // 오늘 휴가자 추출
      const todayVacations = sortEvents(events.filter(e => e.category === 'vacation' && isEventOnDate(e, todayStr)));

      // 이번 주 휴가 일정 추출 (기간 겹침 확인)
      const weekVacations = events.filter(e => {
        if (e.category !== 'vacation') return false;
        const start = e.startDate || e.date;
        const end = e.endDate || e.date;
        return start <= weekEndStr && end >= weekStartStr;
      }).sort((a, b) => (a.startDate || a.date).localeCompare(b.startDate || b.date));

      // 상단 카운트 뱃지 (오늘 휴가자 수 표기)
      const countBadge = document.getElementById('sidebarVacationCount');
      if (countBadge) {
        countBadge.textContent = `${todayVacations.length}명`;
      }

      // 오늘 휴가자 칩 렌더링
      const todayChipsContainer = document.getElementById('sidebarTodayVacationChips');
      if (todayChipsContainer) {
        todayChipsContainer.innerHTML = '';
        if (todayVacations.length === 0) {
          todayChipsContainer.innerHTML = `<div style="width:100%; background:var(--bg-vanilla); border-radius:14px; padding:16px; font-size:0.88rem; color:var(--text-muted); text-align:center;">오늘 휴가자가 없습니다 💼</div>`;
        } else {
          todayVacations.forEach(v => {
            const chip = document.createElement('div');
            chip.className = 'vacation-chip';
            const icon = getVacationIcon(v.vacationType);
            chip.innerHTML = `<span>${icon} ${escapeHtml(v.vacationer || '휴가자')}</span><span class="vacation-type-tag">${escapeHtml(v.vacationType || '연차')}</span>`;
            chip.addEventListener('click', () => openEditModal(v.id));
            todayChipsContainer.appendChild(chip);
          });
        }
      }

      // 이번 주 휴가 리스트 렌더링
      const weekVacationList = document.getElementById('sidebarWeekVacationList');
      if (weekVacationList) {
        weekVacationList.innerHTML = '';
        if (weekVacations.length === 0) {
          weekVacationList.innerHTML = `<div style="width:100%; background:var(--bg-vanilla); border-radius:14px; padding:16px; font-size:0.88rem; color:var(--text-muted); text-align:center;">이번 주 예정된 휴가가 없습니다 🏖️</div>`;
        } else {
          weekVacations.forEach(v => {
            const item = document.createElement('div');
            item.className = 'sidebar-item-card is-vacation';
            const icon = getVacationIcon(v.vacationType);
            const startObj = new Date(v.startDate || v.date);
            const endObj = new Date(v.endDate || v.date);
            const isMultiDay = (v.startDate && v.endDate && v.startDate !== v.endDate);
            const dateText = isMultiDay
              ? `${startObj.getMonth()+1}.${startObj.getDate()} ~ ${endObj.getMonth()+1}.${endObj.getDate()}`
              : `${startObj.getMonth()+1}.${startObj.getDate()} (${getDayOfWeekKorean(startObj.getDay())})`;

            item.innerHTML = `
              <div class="sidebar-item-top">
                <div style="display:flex; align-items:center; gap:8px; overflow:hidden;">
                  <span class="sidebar-item-date-badge">${dateText}</span>
                  <span class="sidebar-item-title">${icon} ${escapeHtml(v.vacationer || '휴가자')}</span>
                </div>
                <span class="vacation-type-tag">${escapeHtml(v.vacationType || '연차')}</span>
              </div>
              ${v.memo ? `<div class="sidebar-item-memo">${escapeHtml(v.memo)}</div>` : ''}
            `;
            item.addEventListener('click', () => openEditModal(v.id));
            weekVacationList.appendChild(item);
          });
        }
      }
    }

    // 2) 오늘 일정 브리핑
    function renderTodayBriefing() {
      const today = new Date();
      const todayStr = formatDate(today);
      const m = today.getMonth() + 1;
      const d = today.getDate();
      const dow = getDayOfWeekKorean(today.getDay());
      const holiday = getPublicHoliday(todayStr);

      const todayDateEl = document.getElementById('sidebarTodayDate');
      if (todayDateEl) {
        todayDateEl.innerHTML = `${m}월 ${d}일 (${dow})${holiday ? ` <span style="font-size:0.75rem; color:#ef4444; font-weight:700;">[${holiday}]</span>` : ''}`;
      }

      const container = document.getElementById('sidebarTodayEvents');
      if (!container) return;
      container.innerHTML = '';

      const todayEvents = sortEvents(events.filter(e => isEventOnDate(e, todayStr) && e.category !== 'vacation'));

      if (todayEvents.length === 0) {
        container.innerHTML = `
          <div class="sidebar-empty-box">
            <span style="font-size:1.3rem;">☕</span>
            <span>오늘 등록된 일정이 없어요</span>
            ${!isReadOnlyMode ? `<button class="btn btn-secondary" style="font-size:0.82rem; padding:6px 14px; margin-top:8px;" onclick="openAddModal('${todayStr}')">+ 오늘 일정 등록</button>` : ''}
          </div>
        `;
        return;
      }

      todayEvents.forEach(evt => {
        const item = document.createElement('div');
        item.className = `sidebar-item-card ${evt.color || 'color-butter'}`;
        const timeDisplay = formatEventTime(evt) || '종일';
        item.innerHTML = `
          <div class="sidebar-item-top">
            <span class="sidebar-item-title">${escapeHtml(evt.title)}</span>
            <span class="sidebar-item-time">${timeDisplay}</span>
          </div>
          ${evt.memo ? `<div class="sidebar-item-memo">${escapeHtml(evt.memo)}</div>` : ''}
        `;
        item.addEventListener('click', () => openEditModal(evt.id));
        container.appendChild(item);
      });
    }

    // 3) 이번 주 일정 브리핑
    function renderWeekBriefing() {
      const weekDays = getWeekRange(currentDate);
      const weekStartStr = formatDate(weekDays[0]);
      const weekEndStr = formatDate(weekDays[6]);

      const weekEvents = events
        .filter(e => {
          if (e.category === 'vacation') return false; // 휴가는 상단 휴가 현황에서 표시
          return isEventOnDate(e, e.date) && e.date >= weekStartStr && e.date <= weekEndStr;
        })
        .sort((a, b) => {
          if (a.date !== b.date) return a.date.localeCompare(b.date);
          const aTime = a.time || '00:00';
          const bTime = b.time || '00:00';
          return aTime.localeCompare(bTime);
        });

      const countBadge = document.getElementById('sidebarWeekCount');
      if (countBadge) {
        countBadge.textContent = `${weekEvents.length}개`;
      }

      const container = document.getElementById('sidebarWeekEvents');
      if (!container) return;
      container.innerHTML = '';

      if (weekEvents.length === 0) {
        container.innerHTML = `
          <div class="sidebar-empty-box">
            <span style="font-size:1.3rem;">✨</span>
            <span>이번 주 일정이 없습니다</span>
          </div>
        `;
        return;
      }

      weekEvents.forEach(evt => {
        const dObj = new Date(evt.date);
        const m = dObj.getMonth() + 1;
        const d = dObj.getDate();
        const dow = getDayOfWeekKorean(dObj.getDay());
        const timeDisplay = formatEventTime(evt) || '종일';

        const item = document.createElement('div');
        item.className = `sidebar-item-card ${evt.color || 'color-butter'}`;
        item.innerHTML = `
          <div class="sidebar-item-top">
            <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
              <span class="sidebar-item-date-badge">${m}.${d} (${dow})</span>
              <span class="sidebar-item-title">${escapeHtml(evt.title)}</span>
            </div>
            <span class="sidebar-item-time">${timeDisplay}</span>
          </div>
          ${evt.memo ? `<div class="sidebar-item-memo">${escapeHtml(evt.memo)}</div>` : ''}
        `;
        item.addEventListener('click', () => openEditModal(evt.id));
        container.appendChild(item);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* =========================================================
       5. 단일 통합 모달 (등록 / 상세 / 수정 / 삭제 완벽 연동)
       ========================================================= */
    const eventModalBackdrop = document.getElementById('eventModalBackdrop');
    const eventForm = document.getElementById('eventForm');

    function setModalCategory(category) {
      document.getElementById('eventCategory').value = category;
      const tabNormal = document.getElementById('tabNormalBtn');
      const tabVacation = document.getElementById('tabVacationBtn');
      const normalBlock = document.getElementById('normalFieldsBlock');
      const vacationBlock = document.getElementById('vacationFieldsBlock');
      const memoLabel = document.getElementById('eventMemoLabel');

      if (category === 'vacation') {
        tabVacation.classList.add('active');
        tabNormal.classList.remove('active');
        normalBlock.style.display = 'none';
        vacationBlock.style.display = 'block';
        memoLabel.textContent = '사유 / 인수인계 내용 (선택)';
        setSelectedColor('color-rose');
      } else {
        tabNormal.classList.add('active');
        tabVacation.classList.remove('active');
        normalBlock.style.display = 'block';
        vacationBlock.style.display = 'none';
        memoLabel.textContent = '메모 / 내용 (선택)';
      }
    }

    document.getElementById('tabNormalBtn').addEventListener('click', () => setModalCategory('normal'));
    document.getElementById('tabVacationBtn').addEventListener('click', () => setModalCategory('vacation'));

    // 새 일정 등록 모드 열기
    function openAddModal(dateStr, initialCategory = 'normal') {
      if (isReadOnlyMode) {
        showToast('🔒 읽기 전용 모드에서는 일정을 추가할 수 없습니다.');
        return;
      }
      activeViewingEventId = null;
      const targetDate = dateStr || formatDate(currentDate);

      document.getElementById('modalTitle').textContent = '새 일정 / 휴가 등록';
      document.getElementById('eventId').value = '';
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDate').value = targetDate;
      document.getElementById('eventTime').value = '';
      document.getElementById('eventEndTime').value = '';
      document.getElementById('vacationerName').value = '';
      document.getElementById('vacationType').value = '연차';
      document.getElementById('vacationStartDate').value = targetDate;
      document.getElementById('vacationEndDate').value = targetDate;
      document.getElementById('eventMemo').value = '';

      // 등록 시 저장하기 버튼 및 삭제 버튼 숨김
      document.getElementById('saveEventBtn').textContent = '저장하기';
      document.getElementById('deleteEventBtn').style.display = 'none';
      document.getElementById('cancelEventModalBtn').textContent = '취소';

      setModalCategory(initialCategory);
      setFieldsDisabled(false);

      eventModalBackdrop.classList.add('active');
      setTimeout(() => {
        if (initialCategory === 'vacation') {
          document.getElementById('vacationerName').focus();
        } else {
          document.getElementById('eventTitle').focus();
        }
      }, 100);
    }

    // 일정 상세 확인 및 바로 수정 모드 열기 (일정 클릭 시 호출)
    function openEditModal(id) {
      const evt = events.find(e => e.id === id);
      if (!evt) return;

      activeViewingEventId = id;
      document.getElementById('eventId').value = evt.id;
      const isVac = (evt.category === 'vacation');

      document.getElementById('modalTitle').textContent = isVac ? '휴가 상세 및 수정' : '일정 상세 및 수정';
      document.getElementById('eventMemo').value = evt.memo || '';
      setSelectedColor(evt.color || (isVac ? 'color-rose' : 'color-butter'));

      if (isVac) {
        setModalCategory('vacation');
        document.getElementById('vacationerName').value = evt.vacationer || '';
        document.getElementById('vacationType').value = evt.vacationType || '연차';
        document.getElementById('vacationStartDate').value = evt.startDate || evt.date;
        document.getElementById('vacationEndDate').value = evt.endDate || evt.date;
      } else {
        setModalCategory('normal');
        document.getElementById('eventTitle').value = evt.title || '';
        document.getElementById('eventDate').value = evt.date || '';
        document.getElementById('eventTime').value = evt.time || '';
        document.getElementById('eventEndTime').value = evt.endTime || '';
      }

      // 읽기 전용 모드에 따른 버튼 및 입력 필드 상태 제어
      const deleteBtn = document.getElementById('deleteEventBtn');
      const saveBtn = document.getElementById('saveEventBtn');
      const cancelBtn = document.getElementById('cancelEventModalBtn');

      if (isReadOnlyMode) {
        deleteBtn.style.display = 'none';
        saveBtn.style.display = 'none';
        cancelBtn.textContent = '닫기';
        setFieldsDisabled(true);
      } else {
        deleteBtn.style.display = 'inline-flex';
        saveBtn.style.display = 'inline-flex';
        saveBtn.textContent = '수정 완료';
        cancelBtn.textContent = '취소';
        setFieldsDisabled(false);
      }

      eventModalBackdrop.classList.add('active');
    }

    function setFieldsDisabled(disabled) {
      const inputs = eventForm.querySelectorAll('input, select, textarea');
      inputs.forEach(input => {
        if (input.id !== 'eventId' && input.id !== 'eventCategory') {
          input.disabled = disabled;
        }
      });
      // 색상 피커 비활성화
      const colorOptions = document.querySelectorAll('.color-option');
      colorOptions.forEach(opt => {
        opt.style.pointerEvents = disabled ? 'none' : 'auto';
      });
    }

    function closeEventModal() {
      eventModalBackdrop.classList.remove('active');
      activeViewingEventId = null;
    }

    function setSelectedColor(colorClass) {
      selectedColor = colorClass;
      document.querySelectorAll('.color-option').forEach(el => {
        if (el.getAttribute('data-color') === colorClass) {
          el.classList.add('selected');
        } else {
          el.classList.remove('selected');
        }
      });
    }

    // 색상 팔레트 클릭
    document.getElementById('colorPickerContainer').addEventListener('click', (e) => {
      const option = e.target.closest('.color-option');
      if (option) {
        setSelectedColor(option.getAttribute('data-color'));
      }
    });

    // 폼 저장 / 수정완료 핸들러
    eventForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (isReadOnlyMode) return;

      const id = document.getElementById('eventId').value;
      const category = document.getElementById('eventCategory').value;
      const memo = document.getElementById('eventMemo').value.trim();

      let eventData = { id, category, color: selectedColor, memo };

      if (category === 'vacation') {
        const vacationer = document.getElementById('vacationerName').value.trim();
        const vacationType = document.getElementById('vacationType').value;
        let startDate = document.getElementById('vacationStartDate').value;
        let endDate = document.getElementById('vacationEndDate').value || startDate;

        if (!vacationer) {
          showToast('휴가자 이름을 입력해주세요.');
          return;
        }
        if (!startDate) {
          showToast('시작일을 선택해주세요.');
          return;
        }
        if (startDate > endDate) {
          endDate = startDate;
        }

        const icon = getVacationIcon(vacationType);
        const title = `${icon} [${vacationType}] ${vacationer}`;

        eventData = {
          ...eventData,
          title,
          vacationer,
          vacationType,
          startDate,
          endDate,
          date: startDate // 하위 호환
        };
      } else {
        const title = document.getElementById('eventTitle').value.trim();
        const date = document.getElementById('eventDate').value;
        const time = document.getElementById('eventTime').value;
        const endTime = document.getElementById('eventEndTime').value;

        if (!title || !date) {
          showToast('일정 제목과 날짜를 입력해주세요.');
          return;
        }

        eventData = {
          ...eventData,
          title,
          date,
          time,
          endTime
        };
      }

      if (id) {
        const index = events.findIndex(item => item.id === id);
        if (index !== -1) {
          events[index] = eventData;
          showToast('일정이 성공적으로 수정되었습니다.');
        }
      } else {
        eventData.id = 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        events.push(eventData);
        showToast(category === 'vacation' ? '🏖️ 휴가 일정이 등록되었습니다.' : '새 일정이 등록되었습니다.');
      }

      saveEventsToStorage(false);
      renderMainView();
      closeEventModal();
    });

    // 모달 내 삭제 버튼 이벤트 연결
    document.getElementById('deleteEventBtn').addEventListener('click', () => {
      if (isReadOnlyMode || !activeViewingEventId) return;
      if (confirm('이 일정을 정말 삭제하시겠습니까?')) {
        events = events.filter(e => e.id !== activeViewingEventId);
        saveEventsToStorage(false);
        renderMainView();
        closeEventModal();
        showToast('일정이 성공적으로 삭제되었습니다.');
      }
    });

    document.getElementById('closeEventModalBtn').addEventListener('click', closeEventModal);
    document.getElementById('cancelEventModalBtn').addEventListener('click', closeEventModal);
    document.getElementById('openAddModalBtn').addEventListener('click', () => openAddModal());

    // ESC 키로 모달 닫기
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeEventModal();
      }
    });

    // 바깥 배경 클릭 시 모달 닫기
    eventModalBackdrop.addEventListener('click', (e) => {
      if (e.target === eventModalBackdrop) closeEventModal();
    });

    /* =========================================================
       6. 공유 링크 생성 (일반 공유 / 읽기 전용 공유)
       ========================================================= */
    async function copyUrlToClipboard(url, successMsg) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = url;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        showToast(successMsg);
      } catch (err) {
        prompt('아래 링크를 복사하여 전달하세요:', url);
      }
    }

    // 1) 일반 일정 공유 링크 (등록/수정 가능)
    document.getElementById('shareEditBtn').addEventListener('click', () => {
      const base64Data = encodeStateToBase64(events);
      if (!base64Data) {
        showToast('일정 데이터 인코딩 중 오류가 발생했습니다.');
        return;
      }
      const baseUrl = window.location.href.split('#')[0];
      const shareUrl = `${baseUrl}#data=${encodeURIComponent(base64Data)}`;
      copyUrlToClipboard(shareUrl, '📋 [공유 링크] 복사 완료! 누구나 일정을 추가/수정할 수 있습니다.');
    });

    // 2) 읽기 전용 공유 링크 (조회만 가능)
    document.getElementById('shareReadonlyBtn').addEventListener('click', () => {
      const base64Data = encodeStateToBase64(events);
      if (!base64Data) {
        showToast('일정 데이터 인코딩 중 오류가 발생했습니다.');
        return;
      }
      const baseUrl = window.location.href.split('#')[0];
      const shareUrl = `${baseUrl}#mode=readonly&data=${encodeURIComponent(base64Data)}`;
      copyUrlToClipboard(shareUrl, '🔒 [읽기 전용 링크] 복사 완료! 접속자는 일정 조회만 가능합니다.');
    });

    /* =========================================================
       7. 뷰 전환 및 날짜 내비게이션
       ========================================================= */
    // 뷰 전환 탭
    document.getElementById('viewMonthBtn').addEventListener('click', () => {
      currentView = 'month';
      renderMainView();
    });
    document.getElementById('viewWeekBtn').addEventListener('click', () => {
      currentView = 'week';
      renderMainView();
    });
    document.getElementById('viewDayBtn').addEventListener('click', () => {
      currentView = 'day';
      renderMainView();
    });

    // 뷰 단위별 이전/다음 이동 핸들러
    function goToPrev() {
      if (currentView === 'month') {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      } else if (currentView === 'week') {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() - 7);
      } else if (currentView === 'day') {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() - 1);
      }
      renderMainView();
    }

    function goToNext() {
      if (currentView === 'month') {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      } else if (currentView === 'week') {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + 7);
      } else if (currentView === 'day') {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + 1);
      }
      renderMainView();
    }

    // 버튼 이벤트 연결
    document.getElementById('prevBtn').addEventListener('click', goToPrev);
    document.getElementById('nextBtn').addEventListener('click', goToNext);

    // 오늘 버튼
    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date();
      renderMainView();
    });

    /* =========================================================
       8. 모바일 터치 스와이프 제스처 (좌우 스와이프 탐지)
       ========================================================= */
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    const calendarCardElement = document.getElementById('calendarCard');

    calendarCardElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    calendarCardElement.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        const duration = Date.now() - touchStartTime;

        // 조건 검증:
        // 1. 수평 이동 거리가 수직 이동 거리보다 커야 함 (상하 스크롤 오작동 방지)
        // 2. 수평 이동 거리가 최소 50px 이상이어야 함
        // 3. 제스처 시간이 800ms 이내여야 함
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) >= 50 && duration < 800) {
          if (deltaX < 0) {
            // 오른쪽 -> 왼쪽 스와이프: 다음 단위 이동
            goToNext();
            showToast('👉 다음 일정으로 이동했습니다.');
          } else {
            // 왼쪽 -> 오른쪽 스와이프: 이전 단위 이동
            goToPrev();
            showToast('👈 이전 일정으로 이동했습니다.');
          }
        }
      }
    }, { passive: true });

    /* =========================================================
       9. 인쇄 및 PDF 출력
       ========================================================= */
    function updatePrintHeader() {
      const dateDisplay = document.getElementById('currentDateDisplay').textContent;
      const viewKorean = currentView === 'month' ? '월간' : currentView === 'week' ? '주간' : '일간';
      document.getElementById('printDateText').textContent = `${dateDisplay} [${viewKorean} 캘린더]`;
    }

    document.getElementById('printBtn').addEventListener('click', () => {
      updatePrintHeader();
      window.print();
    });

    window.addEventListener('beforeprint', updatePrintHeader);

    // URL 해시 변경 실시간 감지
    window.addEventListener('hashchange', () => {
      loadInitialEvents();
      renderMainView();
    });

    /* =========================================================
       10. 앱 시작
       ========================================================= */
    loadInitialEvents();
    renderMainView();
  </script>
</body>
</html>
